# 앱 빌드: Android APK/AAB (서명 키는 Secrets 가 있을 때만 서명), iOS 는 시뮬레이터용 빌드로 컴파일 검증
# 서명용 Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, GOOGLE_SERVICES_JSON
# 저장소 변수: APP_URL (예: https://dagym-workspace.vercel.app)
name: mobile
on:
  push:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: mobile } }
    env:
      APP_URL: ${{ vars.APP_URL || 'https://dagym-workspace.vercel.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - name: google-services.json (있으면)
        env: { GSJ: '${{ secrets.GOOGLE_SERVICES_JSON }}' }
        run: if [ -n "$GSJ" ]; then echo "$GSJ" > android/app/google-services.json; fi
      - name: 서명 키 (있으면)
        env: { KS: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' }
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > $RUNNER_TEMP/release.jks; echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV; fi
          echo "APP_HOST=$(node -e 'console.log(new URL(process.env.APP_URL).host)')" >> $GITHUB_ENV
      - run: npx cap sync android
      - working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            mobile/android/app/build/outputs/apk/**/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
          retention-days: 14
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    defaults: { run: { working-directory: mobile } }
    env:
      APP_URL: ${{ vars.APP_URL || 'https://dagym-workspace.vercel.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx cap sync ios
      - name: 시뮬레이터용 빌드 (서명 없음 — 컴파일 검증)
        working-directory: mobile/ios/App
        run: xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -30
