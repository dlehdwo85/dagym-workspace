# 스토어 업로드 (수동 실행). 필요한 Secrets 가 없으면 해당 작업은 "설정 대기"로 끝난다.
# Android → Google Play 내부 테스트 트랙: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD,
#            GOOGLE_SERVICES_JSON, PLAY_SERVICE_ACCOUNT_JSON
# iOS     → TestFlight: APPLE_TEAM_ID(변수), ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, GOOGLE_SERVICE_INFO_PLIST
name: release
on:
  workflow_dispatch:
    inputs:
      version_name: { description: '표시 버전 (예: 1.0.1)', required: true, default: '1.0.0' }
      android: { type: boolean, default: true, description: 'Google Play 내부 테스트 업로드' }
      ios: { type: boolean, default: true, description: 'TestFlight 업로드' }
permissions:
  contents: read
jobs:
  android:
    if: inputs.android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: mobile } }
    env:
      APP_URL: ${{ vars.APP_URL }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: ${{ inputs.version_name }}
    steps:
      - name: 설정 확인
        id: cfg
        working-directory: .
        run: echo "ready=${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.PLAY_SERVICE_ACCOUNT_JSON != '' && vars.APP_URL != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.cfg.outputs.ready != 'true'
        working-directory: .
        run: echo "::warning::Android 업로드 설정 대기 (서명 키·Play 서비스 계정·APP_URL 필요)"
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ready == 'true'
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        if: steps.cfg.outputs.ready == 'true'
        with: { distribution: temurin, java-version: 21 }
      - if: steps.cfg.outputs.ready == 'true'
        env: { KS: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}', GSJ: '${{ secrets.GOOGLE_SERVICES_JSON }}' }
        run: |
          npm ci
          echo "$KS" | base64 -d > $RUNNER_TEMP/release.jks
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
          echo "APP_HOST=$(node -e 'console.log(new URL(process.env.APP_URL).host)')" >> $GITHUB_ENV
          if [ -n "$GSJ" ]; then echo "$GSJ" > android/app/google-services.json; else echo "::warning::google-services.json 없음 — 앱 푸시 미동작"; fi
          npx cap sync android
      - if: steps.cfg.outputs.ready == 'true'
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon
      - if: steps.cfg.outputs.ready == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: kr.co.dagym.workos
          releaseFiles: mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
  ios:
    if: inputs.ios
    runs-on: macos-15
    timeout-minutes: 45
    defaults: { run: { working-directory: mobile } }
    env:
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: 설정 확인
        id: cfg
        working-directory: .
        run: echo "ready=${{ secrets.ASC_KEY_P8 != '' && vars.APPLE_TEAM_ID != '' && vars.APP_URL != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.cfg.outputs.ready != 'true'
        working-directory: .
        run: echo "::warning::iOS 업로드 설정 대기 (App Store Connect API 키·APPLE_TEAM_ID·APP_URL 필요)"
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ready == 'true'
        with: { node-version: 22 }
      - name: Xcode 26 선택 (App Store 업로드는 iOS 26 SDK 이상 필요)
        if: steps.cfg.outputs.ready == 'true'
        working-directory: .
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error::이 러너에 Xcode 26 이 없습니다 — runs-on 을 macos-26 으로 바꾸세요"; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - if: steps.cfg.outputs.ready == 'true'
        env: { P8: '${{ secrets.ASC_KEY_P8 }}', GSI: '${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}' }
        run: |
          npm ci && npx cap sync ios
          mkdir -p $RUNNER_TEMP/asc && echo "$P8" > $RUNNER_TEMP/asc/key.p8
          if [ -n "$GSI" ]; then echo "$GSI" > ios/App/App/GoogleService-Info.plist; else echo "::warning::GoogleService-Info.plist 없음 — 앱 푸시 미동작"; fi
          cat > $RUNNER_TEMP/export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ vars.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
      - if: steps.cfg.outputs.ready == 'true'
        working-directory: mobile/ios/App
        run: |
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $RUNNER_TEMP/asc/key.p8 -authenticationKeyID ${{ secrets.ASC_KEY_ID }} -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}"
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/App.xcarchive DEVELOPMENT_TEAM=${{ vars.APPLE_TEAM_ID }} \
            MARKETING_VERSION=${{ inputs.version_name }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO archive
          # 무서명 archive 에는 entitlements 가 박히지 않아 export 후 푸시(aps-environment)가 빠진다 →
          # 임시(ad-hoc) 서명으로 entitlements 를 넣어 두면 export 의 배포 서명이 그대로 이어받는다
          APP=$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app
          find "$APP/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -exec codesign --force --sign - {} \; 2>/dev/null || true
          codesign --force --sign - --entitlements App/App.entitlements "$APP"
          codesign -d --entitlements - "$APP" 2>/dev/null | grep -q aps-environment || { echo "::error::aps-environment 가 앱에 없습니다"; exit 1; }
          # 서명은 아래 export 단계에서 배포용(App Store Connect)으로 자동 처리 — 개발용 프로필·등록 기기 불필요
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive -exportOptionsPlist $RUNNER_TEMP/export.plist \
            -exportPath $RUNNER_TEMP/out $AUTH
