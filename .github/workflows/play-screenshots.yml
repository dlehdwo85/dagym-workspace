# Google Play 스토어 등록정보의 스크린샷 교체(대표 11/14 #1047 새 스크린샷 · 로컬 11/19 요청 — Play Console 자동 조작이 안 돼 API 로)
# — release.yml 과 같은 키(PLAY_SERVICE_ACCOUNT_JSON). mode=plan 은 읽기만(지금 등록된 장과 올릴 파일을 견줘 보고),
#   mode=apply 는 그 언어·종류의 스크린샷을 모두 지우고 새 파일을 올린 뒤 반영(올리다 실패하면 반영하지 않음 — 스토어 그대로).
# 공개 스토어 화면이 바뀌는 일이라 apply 는 대표 승인 뒤에만 실행한다. 키 값은 출력하지 않는다.
# 파일: docs/handoff/store/v5-general/play-01.png ~ play-07.png (1080×1920, 이름 순서 = 스토어 순서)
name: play-screenshots
on:
  workflow_dispatch:
    inputs:
      mode: { description: 'plan = 읽기만 · apply = 바꾸기(대표 승인 뒤)', type: choice, options: [plan, apply], default: plan }
      language: { description: '스토어 등록정보 언어', required: true, default: 'ko-KR' }
      image_type: { description: '스크린샷 종류', type: choice, options: [phoneScreenshots, sevenInchScreenshots, tenInchScreenshots], default: phoneScreenshots }
      shots_dir: { description: '스크린샷 폴더', required: true, default: 'docs/handoff/store/v5-general' }
      file_prefix: { description: '파일 이름 앞부분(이 글자로 시작하는 png·jpg 를 이름 순서대로)', required: true, default: 'play-' }
permissions:
  contents: read
jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 설정 확인
        id: cfg
        run: echo "ready=${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.cfg.outputs.ready != 'true'
        run: echo "::error::Play 서비스 계정(PLAY_SERVICE_ACCOUNT_JSON)이 Secrets 에 없습니다"; exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Google Play 스크린샷
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          MODE: ${{ inputs.mode }}
          LANGUAGE: ${{ inputs.language }}
          IMAGE_TYPE: ${{ inputs.image_type }}
          SHOTS_DIR: ${{ inputs.shots_dir }}
          FILE_PREFIX: ${{ inputs.file_prefix }}
        run: node scripts/play-screenshots.mjs
