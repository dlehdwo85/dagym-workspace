# 매일 03:20(KST) 운영 DB 백업(암호화) → S3 호환 저장소. 매주 일요일에는 임시 DB 로 실제 복원 훈련까지 수행.
# 필요한 저장소 Secrets: PROD_DATABASE_URL, BACKUP_PASSPHRASE, S3_ENDPOINT, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY, BACKUP_S3_BUCKET
name: backup
on:
  schedule:
    - cron: '20 18 * * *'
  workflow_dispatch:
    inputs:
      drill: { description: '복원 훈련도 실행', type: boolean, default: true }
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: drill, POSTGRES_PASSWORD: drill, POSTGRES_DB: drill }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U drill" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      BACKUP_DIR: /tmp/backups
    steps:
      - name: 설정 확인
        id: cfg
        run: echo "ready=${{ secrets.PROD_DATABASE_URL != '' && secrets.BACKUP_PASSPHRASE != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ready == 'true'
        with: { node-version: 22, cache: npm }
      - name: PostgreSQL 17 클라이언트
        if: steps.cfg.outputs.ready == 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - if: steps.cfg.outputs.ready == 'true'
        run: npm ci --omit=dev --ignore-scripts
      - name: 백업
        if: steps.cfg.outputs.ready == 'true'
        run: node scripts/backup.mjs | tee backup.log
      - name: 복원 훈련 (일요일 또는 수동)
        if: steps.cfg.outputs.ready == 'true' && github.event.inputs.drill != 'false'
        env:
          RESTORE_DATABASE_URL: postgres://drill:drill@localhost:5432/drill
        run: |
          if [ "$(date -u +%u)" != "6" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then echo "평일: 복원 훈련 생략"; exit 0; fi
          FILE=$(head -1 backup.log | python3 -c 'import sys,json;print(json.load(sys.stdin)["file"])')
          node scripts/restore.mjs "$FILE"
          for q in "select count(*) from users" "select count(*) from tasks" "select count(*) from events"; do
            A=$(psql -tA "$DATABASE_URL" -c "$q"); B=$(psql -tA "$RESTORE_DATABASE_URL" -c "$q")
            echo "$q 운영=$A 복원=$B"; [ "$A" -le "$B" ] || [ $((A-B)) -le 5 ] || { echo "불일치"; exit 1; }
          done
