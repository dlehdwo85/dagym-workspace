# 모든 푸시·PR: 타입검사 → 빌드 → API 통합 시험 → 실제 브라우저 E2E
name: ci
on:
  push:
    branches: [main, 'claude/**']
    # 로컬 11/21: 기록만 바꾼 푸시(docs·*.md — 로컬·클라우드 기록 커밋)는 시험을 돌리지 않음(실행이 줄을 서서 1시간 넘게 밀리던 것). 코드가 함께 바뀌면 그대로 돌림
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
# 작업 브랜치(claude/**)는 같은 내용이 main 에도 올라가므로 새 푸시가 오면 앞 실행을 취소 — main 은 커밋마다 끝까지 돌림
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  test:
    # 376차: ubuntu-latest 가 26.04 로 바뀌어 Playwright 1.56 이 chromium·의존성을 못 깖(CI 2225~2235 E2E 단계 실패, API 시험은 통과) → 지원되는 24.04 로 고정
    runs-on: ubuntu-24.04
    timeout-minutes: 210 # API 시험 ~25분 + E2E ~70분 + 자정(KST) 넘김을 피하려고 기다리는 시간(최대 약 105분)
    services:
      postgres:
        image: postgres:16
        # 정렬 규칙(collation)을 로컬 시험 DB 와 같은 C.UTF-8 로 — 이미지 기본 en_US.utf8 은 한글을 가나다순으로 정렬하지 않아(glibc) 제목·파일 이름 순서를 보는 시험이 CI 에서만 깨짐
        env: { POSTGRES_USER: workos, POSTGRES_PASSWORD: workos, POSTGRES_DB: workos_test, POSTGRES_INITDB_ARGS: --locale=C.UTF-8 }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U workos -d workos_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://workos:workos@localhost:5432/workos_test
      DATABASE_URL: postgres://workos:workos@localhost:5432/workos_test
      APP_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # 369차(CI 2202): ffmpeg-static 이 설치 때 실행 파일 내려받기에 실패해도 npm ci 는 성공 → 영상 시험 11건이 ENOENT. 없으면 다시 받음(3번), 그래도 없으면 여기서 멈춤
      - run: for i in 1 2 3; do test -x node_modules/ffmpeg-static/ffmpeg && break; node node_modules/ffmpeg-static/install.js || sleep 5; done; test -x node_modules/ffmpeg-static/ffmpeg
      - run: npm run typecheck
      - run: npm run build
      # 11/19 밤 실패 7건(main·작업 브랜치)이 모두 '자정(KST)을 넘겨 끝난 실행'이었다 — 시험은 시작할 때의 오늘로 자료를 만들고 서버·화면은 지금 날짜로 계산해
      # D-2 → D-1, "2일 지남" → "3일 지남", 퇴사일·날짜 같음 비교가 어긋난다(자정 전에 끝난 실행은 모두 통과). 시험(API ~25분 + 화면 ~70분)이 자정을 넘길 것 같으면 자정이 지난 뒤에 시작한다.
      - name: 자정(KST) 넘김 피하기
        run: |
          left=$(( $(TZ=Asia/Seoul date -d 'tomorrow 00:00' +%s) - $(date +%s) ))
          if [ "$left" -lt 6300 ]; then
            echo "자정(KST)까지 ${left}초 — 시험이 자정을 넘기지 않게 $((left + 30))초 기다린 뒤 시작합니다" | tee -a "$GITHUB_STEP_SUMMARY"
            sleep $((left + 30))
          else
            echo "자정(KST)까지 ${left}초 — 바로 시작"
          fi
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-screens, path: docs/screens, retention-days: 7 }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: e2e-failures, path: test-results, retention-days: 7, if-no-files-found: ignore }
