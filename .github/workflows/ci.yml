# 모든 푸시·PR: 타입검사 → 빌드 → API 통합 시험 → 실제 브라우저 E2E
name: ci
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # API 시험 ~25분 + E2E 까지 한 작업
    services:
      postgres:
        image: postgres:16
        # 정렬 규칙(collation)을 로컬 시험 DB 와 같은 C.UTF-8 로 — 이미지 기본 en_US.utf8 은 한글을 가나다순으로 정렬하지 않아(glibc) 제목·파일 이름 순서를 보는 시험이 CI 에서만 깨짐
        env: { POSTGRES_USER: workos, POSTGRES_PASSWORD: workos, POSTGRES_DB: workos_test, POSTGRES_INITDB_ARGS: --locale=C.UTF-8 }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U workos -d workos_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://workos:workos@localhost:5432/workos_test
      DATABASE_URL: postgres://workos:workos@localhost:5432/workos_test
      APP_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-screens, path: docs/screens, retention-days: 7 }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: e2e-failures, path: test-results, retention-days: 7, if-no-files-found: ignore }
