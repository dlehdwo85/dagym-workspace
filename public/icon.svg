<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<!-- WorkIn 아이콘 17차-3D S3 — SVG 필터 재현(Chrome CSS 렌더 원본과 거의 같음, 미세 차이는 README 참고) -->

  <defs>
    <linearGradient id="wi-bgG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13866f"/><stop offset="1" stop-color="#0b5c4e"/></linearGradient>
    <radialGradient id="wi-bgHi" cx="0.26" cy="0.10" r="0.676"><stop offset="0" stop-color="#fff" stop-opacity="0.32"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <filter id="wi-inset" x="-20%" y="-20%" width="140%" height="140%">
      <feComponentTransfer in="SourceAlpha"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer>
      <feGaussianBlur stdDeviation="36" result="blur"/>
      <feFlood flood-color="#001410" flood-opacity="0.48"/><feComposite in2="blur" operator="in"/>
      <feComposite in2="SourceAlpha" operator="in" result="sh1"/>
      <feComponentTransfer in="SourceAlpha"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer>
      <feOffset dy="3" result="off"/><feFlood flood-color="#fff" flood-opacity="0.20"/><feComposite in2="off" operator="in"/>
      <feComposite in2="SourceAlpha" operator="in" result="sh2"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="sh1"/><feMergeNode in="sh2"/></feMerge>
    </filter>
    <linearGradient id="wi-bodyG" gradientUnits="userSpaceOnUse" x1="0" y1="29" x2="0" y2="91"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EEF3F1"/></linearGradient>
    <linearGradient id="wi-hdrG" gradientUnits="userSpaceOnUse" x1="0" y1="29" x2="0" y2="45"><stop offset="0" stop-color="#FBBF24"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
    <linearGradient id="wi-hdrGloss" gradientUnits="userSpaceOnUse" x1="0" y1="29" x2="0" y2="37"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.58"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <linearGradient id="wi-hdrDrop" gradientUnits="userSpaceOnUse" x1="0" y1="45" x2="0" y2="47.4"><stop offset="0" stop-color="#000" stop-opacity="0.20"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
    <linearGradient id="wi-sheenG" gradientUnits="userSpaceOnUse" x1="0" y1="29" x2="0" y2="62"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.52"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <linearGradient id="wi-checkG" gradientUnits="userSpaceOnUse" x1="0" y1="55" x2="0" y2="80"><stop offset="0" stop-color="#15837A"/><stop offset="1" stop-color="#0B625B"/></linearGradient>
    <linearGradient id="wi-curlG" gradientUnits="userSpaceOnUse" x1="92" y1="91" x2="80" y2="79"><stop offset="0" stop-color="#F3FDF9"/><stop offset="1" stop-color="#B9DED3"/></linearGradient>
    <linearGradient id="wi-ringG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#DDE4E2"/><stop offset=".32" stop-color="#FFFFFF"/><stop offset=".7" stop-color="#F1F5F4"/><stop offset="1" stop-color="#C3CECB"/></linearGradient>
    <clipPath id="wi-bodyClip"><path d="M40 29 H80 A12 12 0 0 1 92 41 V78 L79 91 H40 A12 12 0 0 1 28 79 V41 A12 12 0 0 1 40 29 Z"/></clipPath>
    <filter id="wi-bodySh" x="-60%" y="-60%" width="220%" height="260%">
      <feDropShadow dx="0" dy="0.352" stdDeviation="0.234" flood-color="#051E1A" flood-opacity="0.26"/>
      <feDropShadow dx="0" dy="1.172" stdDeviation="0.820" flood-color="#051E1A" flood-opacity="0.36"/>
      <feDropShadow dx="0" dy="6.563" stdDeviation="4.688" flood-color="#051E1A" flood-opacity="0.42"/>
    </filter>
    <filter id="wi-ringSh" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0.586" stdDeviation="0.352" flood-color="#051E1A" flood-opacity="0.40"/></filter>
    <filter id="wi-innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="0" dy=".9" in="SourceAlpha"/><feGaussianBlur stdDeviation=".9" result="ob"/>
      <feComposite operator="out" in="SourceAlpha" in2="ob" result="inv"/>
      <feFlood flood-color="#000" flood-opacity="0.42" result="col"/><feComposite operator="in" in="col" in2="inv" result="sh"/>
      <feComposite operator="over" in="sh" in2="SourceGraphic"/>
    </filter>
    <filter id="wi-softBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.1"/></filter>
    <filter id="wi-slotBlur" x="-30%" y="-50%" width="160%" height="200%"><feGaussianBlur stdDeviation=".45"/></filter>
  </defs>
  <g filter="url(#wi-inset)"><rect width="1024" height="1024" rx="230.4" fill="url(#wi-bgG)"/><rect width="1024" height="1024" rx="230.4" fill="url(#wi-bgHi)"/></g>
  <svg viewBox="0 0 120 120" width="1024" height="1024" overflow="visible">
    <g filter="url(#wi-bodySh)">
      <path d="M40 29 H80 A12 12 0 0 1 92 41 V78 L79 91 H40 A12 12 0 0 1 28 79 V41 A12 12 0 0 1 40 29 Z" fill="url(#wi-bodyG)"/>
      <g clip-path="url(#wi-bodyClip)">
        <path d="M40 29 H80 A12 12 0 0 1 92 41 V78 L79 91 H40 A12 12 0 0 1 28 79 V41 A12 12 0 0 1 40 29 Z" fill="none" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="1.1"/>
        <path d="M40 29 H80 A12 12 0 0 1 92 41 V45 H28 V41 A12 12 0 0 1 40 29 Z" fill="url(#wi-hdrG)"/>
        <rect x="28" y="29" width="64" height="8" fill="url(#wi-hdrGloss)"/>
        <rect x="28" y="44.3" width="64" height=".9" fill="#B45309" opacity=".65"/>
        <rect x="28" y="45.2" width="64" height="2.2" fill="url(#wi-hdrDrop)"/>
        <path d="M28 29 H92 V50 Q60 63 28 54 Z" fill="url(#wi-sheenG)"/>
      </g>
    </g>
    <path d="M41 67 L54 79 L79 55" fill="none" stroke="url(#wi-checkG)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#wi-innerShadow)"/>
    <path d="M79 91 L79 78 L92 78 Q87.84 86.84 79 91 Z" fill="#000" opacity=".36" filter="url(#wi-softBlur)" transform="translate(-2.08 -1.82)"/>
    <path d="M79 91 L79 78 L92 78 Q87.84 86.84 79 91 Z" fill="url(#wi-curlG)"/>
    <path d="M92 78 Q87.84 86.84 79 91" fill="none" stroke="#FFFFFF" stroke-opacity=".6" stroke-width=".5"/>
    <g filter="url(#wi-ringSh)">
      <rect x="38.6" y="30.3" width="9.8" height="5.4" rx="2.7" fill="#7C2D12" opacity=".65" filter="url(#wi-slotBlur)"/>
      <rect x="71.6" y="30.3" width="9.8" height="5.4" rx="2.7" fill="#7C2D12" opacity=".65" filter="url(#wi-slotBlur)"/>
      <rect x="40" y="23" width="7" height="14" rx="3.5" fill="url(#wi-ringG)"/>
      <rect x="73" y="23" width="7" height="14" rx="3.5" fill="url(#wi-ringG)"/>
      <rect x="41.6" y="24" width="1.4" height="12" rx=".7" fill="#FFFFFF" opacity=".8"/>
      <rect x="74.6" y="24" width="1.4" height="12" rx=".7" fill="#FFFFFF" opacity=".8"/>
    </g>
  </svg>
</svg>